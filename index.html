                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="rounded-xl border border-slate-700 bg-slate-800/50 p-4">
                                                <div className="flex items-start gap-3">
                                                    <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-fuchsia-950 text-xs font-extrabold text-fuchsia-300">3</span>
                                                    <div className="min-w-0 flex-1">
                                                        <div className="flex flex-wrap items-start justify-between gap-3">
                                                            <div>
                                                                <h3 className="text-sm font-bold text-white">Lokale Boden-/Abgestorben-Korrektur</h3>
                                                                <p className="mt-1 text-[11px] leading-relaxed text-slate-400">
                                                                    Setze einen Punkt auf eine falsch zugeordnete Boden- oder Abgestorben-Fläche. Nur direkt zusammenhängende Nachbarpixel mit derselben Phase-2-Ausgangskategorie werden umgeordnet.
                                                                </p>
                                                            </div>
                                                            {twoPhaseRefinementPoints.length > 0 && (
                                                                <button
                                                                    type="button"
                                                                    onClick={clearTwoPhaseRefinementPoints}
                                                                    className="px-2.5 py-1.5 rounded-lg text-xs font-bold border border-slate-600 bg-slate-900 text-slate-300 hover:bg-slate-700"
                                                                >
                                                                    Punkte löschen
                                                                </button>
                                                            )}
                                                        </div>

                                                        <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            <button
                                                                type="button"
                                                                onClick={() => {
                                                                    setPickingCategory(prev => prev === 'dead' ? null : 'dead');
                                                                    setBrushActive(false);
                                                                    setError(null);
                                                                }}
                                                                className={`min-h-[42px] rounded-lg border px-3 py-2 text-xs font-bold flex items-center justify-center gap-2 transition-all ${
                                                                    pickingCategory === 'dead'
                                                                        ? 'bg-yellow-500 text-slate-950 border-yellow-300 ring-1 ring-yellow-300'
                                                                        : 'bg-slate-900 text-yellow-300 border-yellow-800 hover:bg-yellow-950/40'
                                                                }`}
                                                            >
                                                                <Plus className="h-3.5 w-3.5" />
                                                                {pickingCategory === 'dead' ? 'Bodenstelle im Bild wählen…' : 'Als Abgestorben markieren'}
                                                            </button>

                                                            <button
                                                                type="button"
                                                                onClick={() => {
                                                                    setPickingCategory(prev => prev === 'soil' ? null : 'soil');
                                                                    setBrushActive(false);
                                                                    setError(null);
                                                                }}
                                                                className={`min-h-[42px] rounded-lg border px-3 py-2 text-xs font-bold flex items-center justify-center gap-2 transition-all ${
                                                                    pickingCategory === 'soil'
                                                                        ? 'bg-pink-500 text-white border-pink-300 ring-1 ring-pink-300'
                                                                        : 'bg-slate-900 text-pink-300 border-pink-800 hover:bg-pink-950/40'
                                                                }`}
                                                            >
                                                                <Plus className="h-3.5 w-3.5" />
                                                                {pickingCategory === 'soil' ? 'Abgestorbene Stelle im Bild wählen…' : 'Als Boden markieren'}
                                                            </button>
                                                        </div>

                                                        <p className="mt-2 text-[10px] leading-relaxed text-slate-500">
                                                            Toleranz 0&nbsp;% ändert nur den angeklickten Pixel. Mit höherer Toleranz wächst die Korrektur räumlich über direkt angrenzende Pixel derselben ursprünglichen Kategorie. Lebend wird nie verändert.
                                                        </p>

                                                        <div className="mt-4 border-t border-slate-700 pt-3">
                                                            <div className="flex flex-wrap items-start justify-between gap-3">
                                                                <div>
                                                                    <h4 className="text-xs font-bold text-slate-200">Weichzeichnung / Lücken schließen</h4>
                                                                    <p className="mt-1 text-[10px] leading-relaxed text-slate-500">
                                                                        Schließt kleine Zwischenräume zwischen gleich klassifizierten Bereichen. Lebend bleibt eine harte Grenze.
                                                                    </p>
                                                                </div>
                                                                <select
                                                                    value={twoPhaseSmoothing.category}
                                                                    onChange={(event) => handleTwoPhaseSmoothingCategoryChange(event.target.value)}
                                                                    className="rounded border border-slate-600 bg-slate-950 px-2 py-1 text-xs text-slate-200"
                                                                    aria-label="Kategorie für Phase-3-Weichzeichnung"
                                                                >
                                                                    <option value="none">Aus</option>
                                                                    <option value="dead">Abgestorben</option>
                                                                    <option value="soil">Boden</option>
                                                                </select>
                                                            </div>

                                                            <div className="mt-3">
                                                                <div className="flex items-center justify-between gap-3">
                                                                    <label className="text-[10px] font-bold uppercase tracking-wider text-slate-500">
                                                                        Radius
                                                                    </label>
                                                                    <output className="font-mono text-xs text-fuchsia-300">
                                                                        {twoPhaseSmoothing.radius}px
                                                                    </output>
                                                                </div>
                                                                <input
                                                                    type="range"
                                                                    min="0"
                                                                    max="50"
                                                                    step="1"
                                                                    value={twoPhaseSmoothing.radius}
                                                                    onChange={(event) => handleTwoPhaseSmoothingRadiusChange(event.target.value)}
                                                                    disabled={twoPhaseSmoothing.category === 'none'}
                                                                    className="settings-slider mt-1 w-full rounded-lg appearance-none cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
                                                                    style={{
                                                                        '--slider-track': 'linear-gradient(90deg, #334155, #a21caf, #f5d0fe)',
                                                                        '--slider-thumb': '#d946ef',
                                                                        '--slider-thumb-ring': 'rgba(217, 70, 239, 0.28)'
                                                                    }}
                                                                    aria-label="Radius für Phase-3-Lückenschluss"
                                                                />
                                                                <div className="mt-1 flex justify-between text-[10px] text-slate-500">
                                                                    <span>keine Lücke</span>
                                                                    <span>größere Lücken schließen</span>
                                                                </div>
                                                                <p className="mt-1 text-[10px] leading-relaxed text-slate-500">
                                                                    Beispiel „Abgestorben“: Bodenpixel werden nur dann umgewandelt, wenn sie zwischen abgestorbenen Bereichen liegen und die Lücke zum eingestellten Radius passt.
                                                                </p>
                                                            </div>
                                                        </div>

                                                        {twoPhaseRefinementPoints.length > 0 && (
                                                            <div className="mt-3 space-y-2">
                                                                {twoPhaseRefinementPoints.map((point, index) => (
                                                                    <div key={point.id} className="calibration-point-row rounded-lg border border-slate-700 bg-slate-900/60 p-2.5">
                                                                        <div className="flex items-center gap-2">
                                                                            <div
                                                                                className="h-6 w-6 shrink-0 rounded-full border border-white/10"
                                                                                style={{ backgroundColor: point.rgb }}
                                                                            ></div>
                                                                            <div className="min-w-0 flex-1">
                                                                                <div className="text-xs font-bold text-slate-200">
                                                                                    Punkt {index + 1}: {point.sourceCategory === 'soil' ? 'Boden' : 'Abgestorben'}
                                                                                    <span className="mx-1.5 text-slate-500">→</span>
                                                                                    <span className={point.category === 'dead' ? 'text-yellow-300' : 'text-pink-300'}>
                                                                                        {point.category === 'dead' ? 'Abgestorben' : 'Boden'}
                                                                                    </span>
                                                                                </div>
                                                                            </div>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => removeTwoPhaseRefinementPoint(point.id)}
                                                                                className="calibration-point-delete inline-flex items-center justify-center rounded-lg text-slate-400 hover:bg-red-950/50 hover:text-red-300"
                                                                                title="Punkt löschen"
                                                                                aria-label={`Phase-3-Punkt ${index + 1} löschen`}
                                                                            >
                                                                                <Trash2 className="h-4 w-4" />
                                                                            </button>
                                                                        </div>

                                                                        <div className="mt-2 flex items-center justify-between gap-3">
                                                                            <label className="text-[10px] font-bold uppercase tracking-wider text-slate-500">
                                                                                Nachbarschaft / Toleranz
                                                                            </label>
                                                                            <output className="font-mono text-xs text-fuchsia-300">{point.tolerance}%</output>
                                                                        </div>
                                                                        <input
                                                                            type="range"
                                                                            min="0"
                                                                            max="100"
                                                                            step="1"
                                                                            value={point.tolerance}
                                                                            onChange={(event) => setTwoPhaseRefinementTolerance(point.id, event.target.value)}
                                                                            className="settings-slider mt-1 w-full rounded-lg appearance-none cursor-pointer"
                                                                            style={{
                                                                                '--slider-track': 'linear-gradient(90deg, #334155, #a21caf, #f5d0fe)',
                                                                                '--slider-thumb': '#d946ef',
                                                                                '--slider-thumb-ring': 'rgba(217, 70, 239, 0.28)'
                                                                            }}
                                                                            aria-label={`Nachbarschaftstoleranz für Phase-3-Punkt ${index + 1}`}
                                                                        />
                                                                        <div className="mt-1 flex justify-between text-[10px] text-slate-500">
                                                                            <span>nur Punkt</span>
                                                                            <span>gesamter verbundener Bereich</span>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="rounded-lg border border-slate-700 bg-slate-900/70 px-3 py-2 text-[11px] leading-relaxed text-slate-400">
                                                Phase&nbsp;1 erkennt und schützt lebende Pflanzen. Phase&nbsp;2 trennt Boden und Abgestorben über die aktivierten Merkmale und Helligkeits-Overrides. Phase&nbsp;3 korrigiert anschließend lokale Boden-/Abgestorben-Bereiche anhand gesetzter Punkte und kann zusätzlich kleine Lücken innerhalb einer gewählten Kategorie schließen. „Sonstiges“ wird in diesem Modus nur durch manuelle Korrekturen erzeugt.
                                            </div>
                                        </div>
                                    ) : (
                                        <>
                                            {categories.map(cat => (
                                                <div key={cat.id} className={`bg-slate-800/50 p-3 sm:p-4 rounded-xl border ${pickingCategory === cat.id ? 'border-fuchsia-500 ring-1 ring-fuchsia-500' : 'border-slate-700'} transition-all`}>
                                                    <div className="flex justify-between items-center mb-3">
                                                        <h3 className={`text-sm uppercase tracking-wider font-bold flex items-center gap-2 ${cat.text}`}>
                                                            <div className={`w-2 h-2 rounded-full ${cat.color} shadow-[0_0_10px_rgba(255,255,255,0.2)]`}></div>
                                                            {cat.label}
                                                        </h3>
                                                        <button 
                                                            onClick={() => { setPickingCategory(prev => prev === cat.id ? null : cat.id); setBrushActive(false); }} 
                                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-all border ${pickingCategory === cat.id ? 'bg-fuchsia-600 text-white border-fuchsia-500 shadow-md' : 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600'}`}
                                                        >
                                                            {pickingCategory === cat.id ? 'Wähle Punkt...' : <><Plus className="h-3 w-3" /> Hinzufügen</>}
                                                        </button>
                                                    </div>

                                                    <div className="space-y-2">
                                                        {calibrationPoints.filter(p => p.category === cat.id).length === 0 ? (
                                                            <p className="text-[10px] text-slate-500 italic text-center py-2">
                                                                {useStandardFallback ? 'Standard-Werte aktiv.' : 'Keine Punkte definiert.'}
                                                            </p>
                                                        ) : (
                                                            calibrationPoints.filter(p => p.category === cat.id).map(point => (
                                                                <div key={point.id} className="calibration-point-row flex items-center gap-2 bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 animate-in fade-in slide-in-from-left-2">
                                                                    <div className="w-6 h-6 rounded-full shadow-inner border border-white/10 shrink-0" style={{backgroundColor: point.rgb}} title={`H:${Math.round(point.h)} S:${Math.round(point.s)}`}></div>
                                                                    <div className="calibration-point-controls flex-1 flex items-center gap-1">
                                                                        <span className="text-[10px] font-bold text-slate-500 uppercase mr-1">Tol.</span>

                                                                        <button 
                                                                            onClick={() => { 
                                                                                setPointTolerance(point.id, point.tolerance - 1); 
                                                                            }}
                                                                            className="w-9 h-9 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded text-slate-300 text-sm font-bold transition-colors"
                                                                        >
                                                                            -
                                                                        </button>

                                                                        <input 
                                                                            type="range" min="0" max="100" 
                                                                            value={point.tolerance} 
                                                                            onChange={(e) => { 
                                                                                setPointTolerance(point.id, e.target.value); 
                                                                            }} 
                                                                            className="flex-1 h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer mx-1"
                                                                        />

                                                                        <button 
                                                                            onClick={() => { 
                                                                                setPointTolerance(point.id, point.tolerance + 1); 
                                                                            }}
                                                                            className="w-9 h-9 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded text-slate-300 text-sm font-bold transition-colors"
                                                                        >
                                                                            +
                                                                        </button>

                                                                        <span className="text-[10px] font-mono text-slate-400 w-6 text-right">{point.tolerance}</span>
                                                                    </div>
                                                                    <button 
                                                                        onClick={() => { 
                                                                            removeCalibrationPoint(point.id); 
                                                                        }} 
                                                                        className="calibration-point-delete text-slate-500 hover:text-red-400 p-1 inline-flex items-center justify-center rounded-lg"
                                                                    >
                                                                        <X className="h-3 w-3"/>
                                                                    </button>
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </>
                                    )}
                                </div>
                                </div>
                                <div className="calibration-footer p-4 border-t border-slate-700 bg-[#1e293b] flex justify-end shrink-0">
                                    <button 
                                        onClick={handleSaveCalibration} 
                                        className="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 shadow-lg transition-transform active:scale-95"
                                    >
                                        Fertig & Speichern
                                    </button>
                                </div>
                                
                                {showUnclassifiedModal && (
                                    <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6 animate-in fade-in">
                                        <div className="mobile-modal-panel bg-slate-800 border border-slate-600 rounded-2xl p-6 shadow-2xl max-w-sm w-full text-center">
                                            <div className="w-12 h-12 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                                                <AlertCircle className="h-6 w-6 text-red-500"/>
                                            </div>
                                            <h3 className="text-lg font-bold text-white mb-2">Unklassifizierte Bereiche</h3>
                                            <p className="text-sm text-slate-300 mb-6">
                                                Es wurden <strong>{calibrationStats?.unclassified}%</strong> der Fläche nicht erkannt. 
                                                Wie sollen diese Bereiche zugeordnet werden?
                                            </p>
                                            <div className="flex flex-col gap-3">
                                                <button onClick={() => applyUnclassifiedDecision('soil')} className="w-full py-2.5 bg-pink-600 hover:bg-pink-700 text-white rounded-lg font-bold transition-colors flex items-center justify-center gap-2">
                                                    <Square className="h-4 w-4"/> Als Boden werten (Empfohlen)
                                                </button>
                                                <button onClick={() => applyUnclassifiedDecision('dead')} className="w-full py-2.5 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg font-bold transition-colors flex items-center justify-center gap-2">
                                                    <AlertCircle className="h-4 w-4"/> Als Abgestorben werten
                                                </button>
                                                <button onClick={() => applyUnclassifiedDecision(null)} className="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm font-medium transition-colors">
                                                    Ignorieren (Transparent lassen)
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
