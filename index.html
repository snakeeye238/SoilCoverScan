    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // --- KONFIGURATION ---
        const API_KEY_STORAGE_KEY = 'soilcoverscan_api_key';

        const getStoredApiKey = () => {
            try {
                return typeof window !== 'undefined' ? (window.localStorage.getItem(API_KEY_STORAGE_KEY) || '') : '';
            } catch (storageError) {
                console.warn('API-Key konnte nicht aus dem Local Storage geladen werden:', storageError);
                return '';
            }
        };

                    previousTargetPosition = linePosition;
                }
            };

            // Horizontal
            for (let y = 0; y < height; y++) {
                const row = new Int32Array(width);
                for (let x = 0; x < width; x++) row[x] = y * width + x;
                fillLineGaps(row);
            }

            // Vertikal
            for (let x = 0; x < width; x++) {
                const column = new Int32Array(height);
                for (let y = 0; y < height; y++) column[y] = y * width + x;
                fillLineGaps(column);
            }

            // Diagonal ↘
            for (let startX = 0; startX < width; startX++) {
                const indices = [];
                for (let x = startX, y = 0; x < width && y < height; x++, y++) {
                    indices.push(y * width + x);
                }
                fillLineGaps(indices);
            }
            for (let startY = 1; startY < height; startY++) {
                const indices = [];
                for (let x = 0, y = startY; x < width && y < height; x++, y++) {
                    indices.push(y * width + x);
                }
                fillLineGaps(indices);
            }

            // Diagonal ↙
            for (let startX = 0; startX < width; startX++) {
                const indices = [];
                for (let x = startX, y = 0; x >= 0 && y < height; x--, y++) {
                    indices.push(y * width + x);
                }
                fillLineGaps(indices);
            }
            for (let startY = 1; startY < height; startY++) {
                const indices = [];
                for (let x = width - 1, y = startY; x >= 0 && y < height; x--, y++) {
                    indices.push(y * width + x);
                }
                fillLineGaps(indices);
            }

            return result;
        };

        const buildTwoPhaseLocalRefinementMap = (
            rgbaData,
            textureData,
            width,
            height,
            settings,
            fallbackRanges,
            refinementPoints,
            smoothingSettings = null
        ) => {
            const pixelCount = Math.max(0, width * height);
            const baseCodes = new Uint8Array(pixelCount);
            const overrideCodes = new Uint8Array(pixelCount);
            if (!rgbaData || !pixelCount) return { baseCodes, overrideCodes };

            // Ausgangsklassifizierung ausschließlich aus Phase 1 + Phase 2.
            for (let pixelIndex = 0, sourceIndex = 0; pixelIndex < pixelCount; pixelIndex++, sourceIndex += 4) {
                const roughnessValue = textureData?.roughness
                    ? textureData.roughness[pixelIndex]
                    : (textureData ? textureData[pixelIndex] : null);
                const fibrousnessValue = textureData?.fibrousness
                    ? textureData.fibrousness[pixelIndex]
                    : 0;

                const category = getTwoPhaseCategory(
                    rgbaData[sourceIndex],
                    rgbaData[sourceIndex + 1],
                    rgbaData[sourceIndex + 2],
                    roughnessValue,
                    fibrousnessValue,
                    settings,
                    fallbackRanges
                );
                baseCodes[pixelIndex] = getTwoPhaseCategoryCode(category);
            }

            // Wiederverwendbare Speicherblöcke vermeiden neue große Arrays je Punkt.
            const queue = new Int32Array(pixelCount);
            const visited = new Uint32Array(pixelCount);
            let visitStamp = 0;
            const imageDiagonal = Math.max(1, Math.hypot(width, height));

            for (const point of (refinementPoints || [])) {
                const sourceCode = getTwoPhaseCategoryCode(point.sourceCategory);
                const targetCode = getTwoPhaseCategoryCode(point.category);
                if (
                    (sourceCode !== TWO_PHASE_CATEGORY_CODES.soil && sourceCode !== TWO_PHASE_CATEGORY_CODES.dead) ||
                    (targetCode !== TWO_PHASE_CATEGORY_CODES.soil && targetCode !== TWO_PHASE_CATEGORY_CODES.dead) ||
                    sourceCode === targetCode
                ) {
                    continue;
                }

                const seedX = getClampedValue(Math.round(point.x), 0, width - 1);
                const seedY = getClampedValue(Math.round(point.y), 0, height - 1);
                const seedIndex = seedY * width + seedX;

                // Der Punkt gilt nur solange die Phase-1/2-Ausgangskategorie noch passt.
                if (baseCodes[seedIndex] !== sourceCode) continue;

                const tolerance = getClampedValue(Number(point.tolerance) || 0, 0, 100);
                const radius = tolerance <= 0
                    ? 0
                    : Math.max(1, Math.round(imageDiagonal * (tolerance / 100)));
                const radiusSquared = radius * radius;

                visitStamp++;
                if (visitStamp === 0xffffffff) {
                    visited.fill(0);
                    visitStamp = 1;
                }

                let queueStart = 0;
                let queueEnd = 0;
                queue[queueEnd++] = seedIndex;
                visited[seedIndex] = visitStamp;

                while (queueStart < queueEnd) {
                    const currentIndex = queue[queueStart++];
                    if (baseCodes[currentIndex] !== sourceCode) continue;

                    const currentY = Math.floor(currentIndex / width);
                    const currentX = currentIndex - currentY * width;
                    const dx = currentX - seedX;
                    const dy = currentY - seedY;
                    if ((dx * dx + dy * dy) > radiusSquared) continue;

                    overrideCodes[currentIndex] = targetCode;

                    if (radius === 0) continue;

                    const tryQueue = (neighborIndex) => {
                        if (
                            neighborIndex >= 0 &&
                            neighborIndex < pixelCount &&
                            visited[neighborIndex] !== visitStamp
                        ) {
                            visited[neighborIndex] = visitStamp;
                            queue[queueEnd++] = neighborIndex;
                        }
                    };

                    if (currentX > 0) tryQueue(currentIndex - 1);
                    if (currentX < width - 1) tryQueue(currentIndex + 1);
                    if (currentY > 0) tryQueue(currentIndex - width);
                    if (currentY < height - 1) tryQueue(currentIndex + width);
                }
            }

            const resolvedCodes = new Uint8Array(pixelCount);
            for (let pixelIndex = 0; pixelIndex < pixelCount; pixelIndex++) {
                resolvedCodes[pixelIndex] = overrideCodes[pixelIndex] || baseCodes[pixelIndex];
            }

            const smoothingCategory = smoothingSettings?.category || 'none';
            const smoothingRadius = smoothingSettings?.radius || 0;
            const finalCodes = smoothingCategory === 'none' || smoothingRadius <= 0
                ? resolvedCodes
                : applyTwoPhaseGapClosing(
                    resolvedCodes,
                    width,
                    height,
                    smoothingCategory,
                    smoothingRadius
                );

            return { baseCodes, overrideCodes, finalCodes };
        };

        const drawTwoPhaseHistogram = (canvas, values, threshold, lowerColor, upperColor) => {
            if (!canvas) return;
            const context = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const bins = new Uint32Array(40);

            for (const value of values || []) {
                bins[Math.min(bins.length - 1, Math.max(0, Math.floor(value / 2.5)))]++;
            }

            context.clearRect(0, 0, width, height);
            const maximum = Math.max(1, ...bins);
            const barWidth = width / bins.length;

            for (let index = 0; index < bins.length; index++) {
                const value = (index + 0.5) * 2.5;
                const barHeight = Math.max(1, (bins[index] / maximum) * (height - 8));
                context.fillStyle = value < threshold ? lowerColor : upperColor;
                context.fillRect(
                    index * barWidth + 1,
                    height - barHeight,
                    Math.max(2, barWidth - 2),
                    barHeight
                );
            }
        };

        const getBrushOffsetsForRadius = (radius, cache) => {
            const safeRadius = Math.max(1, Math.floor(radius));
            if (cache[safeRadius]) return cache[safeRadius];

            const offsets = [];
            const radiusSquared = safeRadius * safeRadius;
            for (let dy = -safeRadius; dy <= safeRadius; dy++) {
                for (let dx = -safeRadius; dx <= safeRadius; dx++) {
                    if (dx * dx + dy * dy <= radiusSquared) {
                        offsets.push([dx, dy]);
                    }
                }
            }

            cache[safeRadius] = offsets;
            return offsets;
        };

        const isGreenishPixel = (r, g, b, h, s, minSaturation = 6, hueMin = 35, hueMax = 190) => {
            const yellowAllowance = getClampedValue((45 - hueMin) / 20, 0, 1);
            const blueAllowance = getClampedValue((hueMax - 190) / 50, 0, 1);
            const redRatio = 0.92 - (yellowAllowance * 0.2);
            const blueRatio = 1 - (blueAllowance * 0.35);

            return isHueInRange(h, hueMin, hueMax) &&
                s >= minSaturation &&
                g >= r * redRatio &&
                g >= b * blueRatio;
        };

        const getCalibrationPointDistance = (h, s, v, point) => {
            const hDiff = getHueDistance(h, point.h);
            const sDiff = Math.abs(s - point.s);
            const vDiff = Math.abs(v - point.v);
            return Math.sqrt((hDiff * 1.35) ** 2 + (sDiff * 0.8) ** 2 + (vDiff * 0.45) ** 2);
        };

        const getStandardCategoryFromHsv = (r, g, b, h, s, v, currentThresholds, textureValue = null, fibrousnessValue = 0) => {
            const greenish = isGreenishPixel(

                g,
                b,
                h,
                s,
                Math.min(currentThresholds.living.satMin, 6),
                currentThresholds.living.hueMin,
                currentThresholds.living.hueMax
            );
            const livingGreenMatch = isHueInRange(h, currentThresholds.living.hueMin, currentThresholds.living.hueMax)
                && s >= currentThresholds.living.satMin
                && s <= (currentThresholds.living.satMax || 100)
                && v >= currentThresholds.living.valMin
                && v <= (currentThresholds.living.valMax || 100)
                && greenish;

            const soilBrightnessMatch = v >= currentThresholds.soil.valMin && v <= currentThresholds.soil.valMax;
            const soilSaturationMatch = s >= (currentThresholds.soil.satMin || 0) && s <= currentThresholds.soil.satMax;
            const soilTextureMatch = textureValue === null
                || textureValue === undefined
                || (
                    textureValue >= (currentThresholds.soil.textureMin || 0)
                    && textureValue <= (currentThresholds.soil.textureMax || 100)
                );
            const soilBrownBaseMatch = soilBrightnessMatch
                && soilSaturationMatch
                && soilTextureMatch
                && isHueInRange(h, currentThresholds.soil.hueMin, currentThresholds.soil.hueMax);
            const soilGrayAllowanceMatch = soilBrightnessMatch
                && soilSaturationMatch
                && soilTextureMatch
                && s <= Math.min(currentThresholds.soil.satMax, 24);
            const soilMatch = soilBrownBaseMatch || soilGrayAllowanceMatch;

            const stoneNeutralMatch = s >= (currentThresholds.stone.satMin || 0) && s <= currentThresholds.stone.satMax;
            const stoneBrightnessMatch = v >= currentThresholds.stone.blackValMax && v <= currentThresholds.stone.whiteValMin;
            const deadMatch = isHueInRange(h, currentThresholds.dead.hueMin, currentThresholds.dead.hueMax)
                && s >= currentThresholds.dead.satMin
                && s <= (currentThresholds.dead.satMax || 100)
                && v >= currentThresholds.dead.valMin
                && v <= (currentThresholds.dead.valMax || 100)
                && !greenish;
            const fibrousResidueColorMatch = isHueInRange(h, 10, 85) || s <= 20;
            const fibrousDeadMatch = soilMatch
                && !greenish
                && fibrousnessValue >= FIBROUS_DEAD_MIN
                && fibrousResidueColorMatch
                && v >= 18
                && v <= 92;

            if (livingGreenMatch) return 'living';
            if (fibrousDeadMatch) return 'dead';
            if (soilMatch) return 'soil';
            if (stoneNeutralMatch && stoneBrightnessMatch && !greenish) return 'stone';
            if (deadMatch) return 'dead';

            return 'dead';
        };

        const getStandardCategoryMatch = (category, r, g, b, currentThresholds, textureValue = null, fibrousnessValue = 0) => {

        const getStandardPreviewCategory = (r, g, b, currentThresholds, visibilityFilter, textureValue = null, fibrousnessValue = 0) => {

        const getPixelCategoryByCalibrationFromHsv = (r, g, b, h, s, v, currentThresholds, activeCalibrationPoints, activeUseStandardFallback, textureValue = null, fibrousnessValue = 0) => {

                    const maxDist = Math.max(1, point.tolerance * 1.8);

                    if (dist <= maxDist && dist < minDistance) {

                        bestMatch = point;
                    }
                }

                if (bestMatch) return bestMatch.category;
            }

            if (activeUseStandardFallback) {
                const standardCategory = getStandardCategoryFromHsv(r, g, b, h, s, v, currentThresholds, textureValue, fibrousnessValue);
                if (standardCategory) return standardCategory;
            }

            return 'unclassified';
        };

        const getPixelCategoryByCalibration = (r, g, b, currentThresholds, activeCalibrationPoints, activeUseStandardFallback, textureValue = null, fibrousnessValue = 0) => {
            const [h, s, v] = rgbToHsv(r, g, b);

        const getImagePayload = (dataUrl) => {

        const getScaledImageDimensions = (width, height, maxEdge = 800) => {
            const safeWidth = Math.max(1, width || 1);
            const safeHeight = Math.max(1, height || 1);
            const scale = Math.min(1, maxEdge / Math.max(safeWidth, safeHeight));
            return {
                width: Math.max(1, Math.round(safeWidth * scale)),
                height: Math.max(1, Math.round(safeHeight * scale))
            };
        };

        const getObjectContainContentRect = (element, contentWidth, contentHeight) => {
            const rect = element?.getBoundingClientRect();
            if (!rect || !rect.width || !rect.height || !contentWidth || !contentHeight) return rect;

            const scale = Math.min(rect.width / contentWidth, rect.height / contentHeight);
            const width = contentWidth * scale;
            const height = contentHeight * scale;
            const left = rect.left + ((rect.width - width) / 2);
            const top = rect.top + ((rect.height - height) / 2);

            return {
                left,
                top,
                width,
                height,

        const COVER_CATEGORY_KEYS = ['living', 'dead', 'stone', 'soil'];

        const normalizePercentagesToHundred = (values, categoryKeys = COVER_CATEGORY_KEYS) => {
            const parsedValues = categoryKeys.map(key => {
                const numericValue = Number.parseFloat(values?.[key]);
                return Number.isFinite(numericValue) && numericValue > 0 ? numericValue : 0;
            });

            const total = parsedValues.reduce((sum, value) => sum + value, 0);
            if (total <= 0) return null;

            const scaledValues = parsedValues.map(value => (value / total) * 100);
            const roundedValues = scaledValues.map(Math.floor);
            let remainder = 100 - roundedValues.reduce((sum, value) => sum + value, 0);

            scaledValues
                .map((value, index) => ({ index, fraction: value - Math.floor(value) }))
                .sort((a, b) => (b.fraction - a.fraction) || (a.index - b.index))
                .forEach(({ index }) => {
                    if (remainder > 0) {
                        roundedValues[index] += 1;

                });

                const rect = e.currentTarget.getBoundingClientRect();
                const clientX = e.clientX - rect.left;
                const clientY = e.clientY - rect.top;
                
                const contentX = (clientX - currentPan.x) / currentZoom;
                const contentY = (clientY - currentPan.y) / currentZoom;

                const zoomSensitivity = 0.001; 
                const delta = -e.deltaY * zoomSensitivity;
                const newZoom = Math.min(Math.max(1, currentZoom + delta * currentZoom), maxZoom);

                const newPanX = clientX - contentX * newZoom;
                const newPanY = clientY - contentY * newZoom;
                
                setZoom(newZoom);
                setPan({ x: newPanX, y: newPanY });
            };

            const startPan = (e) => {
                if (e.button === 2 || e.button === 1) {
                    e.preventDefault();
                    setIsPanning(true);
                    lastMousePos.current = { x: e.clientX, y: e.clientY };
                }
            };

            const doPan = (e, currentPan, setPan) => {
                // Functional update keeps mouse and touch movement smooth during rapid pointer events.
                e.preventDefault();
                const deltaX = e.clientX - lastMousePos.current.x;
                const deltaY = e.clientY - lastMousePos.current.y;
                setPan(previousPan => ({ x: previousPan.x + deltaX, y: previousPan.y + deltaY }));
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            const clampZoom = (zoom, maxZoom = DEFAULT_ZOOM_MAX) => Math.min(Math.max(1, zoom), maxZoom);
            const storePointer = (pointerMap, event) => {
                pointerMap.set(event.pointerId, {
                    clientX: event.clientX,
                    clientY: event.clientY,
                    pointerType: event.pointerType
                });
            };
            const getFirstTwoPointers = (pointerMap) => Array.from(pointerMap.values()).slice(0, 2);
            const getPointerDistance = (first, second) => Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY);
            const getPointerMidpoint = (first, second, containerRect) => ({
                x: ((first.clientX + second.clientX) / 2) - containerRect.left,
                y: ((first.clientY + second.clientY) / 2) - containerRect.top
            });
            const createPinchSnapshot = (pointerMap, container, currentZoom, currentPan) => {
                if (!container || pointerMap.size < 2) return null;
                const [first, second] = getFirstTwoPointers(pointerMap);
                const containerRect = container.getBoundingClientRect();
                const midpoint = getPointerMidpoint(first, second, containerRect);
                return {
                    startDistance: Math.max(1, getPointerDistance(first, second)),
                    startZoom: currentZoom,
                    startPan: { ...currentPan },
                    contentX: (midpoint.x - currentPan.x) / currentZoom,
                    contentY: (midpoint.y - currentPan.y) / currentZoom
                };
            };
            const updatePinchGesture = (pointerMap, container, snapshot, maxZoom, setZoom, setPan) => {
                if (!container || !snapshot || pointerMap.size < 2) return;
                const [first, second] = getFirstTwoPointers(pointerMap);
                const containerRect = container.getBoundingClientRect();
                const midpoint = getPointerMidpoint(first, second, containerRect);
                const nextZoom = clampZoom(
                    snapshot.startZoom * (getPointerDistance(first, second) / snapshot.startDistance),
                    maxZoom
                );
                setZoom(nextZoom);
                setPan({
                    x: midpoint.x - snapshot.contentX * nextZoom,
                    y: midpoint.y - snapshot.contentY * nextZoom
                });
            };
            const setZoomAroundClientPoint = (container, clientX, clientY, currentZoom, currentPan, nextZoom, setZoom, setPan, maxZoom = DEFAULT_ZOOM_MAX) => {
                if (!container) return;
                const containerRect = container.getBoundingClientRect();
                const localX = clientX - containerRect.left;
                const localY = clientY - containerRect.top;
                const contentX = (localX - currentPan.x) / currentZoom;
                const contentY = (localY - currentPan.y) / currentZoom;
                const safeZoom = clampZoom(nextZoom, maxZoom);
                setZoom(safeZoom);
                setPan({
                    x: localX - contentX * safeZoom,
                    y: localY - contentY * safeZoom
                });
            };
            const changeCalibrationZoom = (factor) => {
                const container = imageContainerRef.current;
                if (!container) return;
                const rect = container.getBoundingClientRect();
                setZoomAroundClientPoint(
                    container,
                    rect.left + rect.width / 2,
                    rect.top + rect.height / 2,
                    calibZoom,
                    calibPan,
                    calibZoom * factor,
                    setCalibZoom,
                    setCalibPan,

            };
            const resetCalibrationView = () => {

            const endPan = () => {

            // Reset zoom when closing/changing

            useEffect(() => {

            useEffect(() => {

            }, [
                showUnclassifiedModal,
                isCalibrationOpen,
                showImageModal,
                isCropping,
                showDiscoveryModal,
                showSettingsModal,
                showPasswordModal,
                showVersionModal
            ]);


            // 1. Farbbasierte Analyse (Hybrid: Manual > Points > Thresholds)
            const analyzeColorBased = useCallback((currentThresholds = thresholds, isPreview = false, remapUnclassifiedTo = null, configOverrides = {}) => {
                if (!canvasRef.current || !overlayRef.current) return null;

                try {
                    const canvas = canvasRef.current;
                    const width = canvas.width;
                    const height = canvas.height;

                    if (width === 0 || height === 0) return null;

                    const ctx = canvas.getContext('2d');
                    const data = imageDataRef.current || ctx.getImageData(0, 0, width, height).data;
                    const hsvData = hsvDataRef.current;
                    const textureData = textureDataRef.current;

                    const overlayCanvas = overlayRef.current;
                    if (overlayCanvas.width !== width || overlayCanvas.height !== height) {
                        overlayCanvas.width = width;
                        overlayCanvas.height = height;
                    }

                    const overlayCtx = overlayCanvas.getContext('2d');
                    const overlayData = overlayCtx.createImageData(width, height);
                    const oData = overlayData.data;

                    let counts = { living: 0, dead: 0, stone: 0, soil: 0, unclassified: 0 };
                    const manualOverrides = manualOverridesRef.current;
                    const activeCalibrationMode = configOverrides.calibrationMode ?? calibrationMode;
                    const pointCalibrationPoints = configOverrides.calibrationPoints ?? calibrationPointsRef.current;
                    const activeCalibrationPoints = activeCalibrationMode === 'point' ? pointCalibrationPoints : [];
                    const activeUseStandardFallback = activeCalibrationMode === 'standard'
                        ? true
                        : (activeCalibrationMode === 'point' ? (configOverrides.useStandardFallback ?? useStandardFallback) : false);
                    const activeTwoPhaseSettings = configOverrides.twoPhaseSettings ?? twoPhaseSettingsRef.current;
                    const activeTwoPhaseRefinementPoints =
                        configOverrides.twoPhaseRefinementPoints ?? twoPhaseRefinementPointsRef.current;
                    const activeTwoPhaseSmoothing =
                        configOverrides.twoPhaseSmoothing ?? twoPhaseSmoothingRef.current;
                    const hasTwoPhaseSmoothing =
                        activeTwoPhaseSmoothing?.category !== 'none' &&
                        Number(activeTwoPhaseSmoothing?.radius || 0) > 0;
                    const twoPhaseLocalRefinement = (
                        activeCalibrationMode === 'twoPhase' &&
                        (activeTwoPhaseRefinementPoints.length > 0 || hasTwoPhaseSmoothing)
                    )
                        ? buildTwoPhaseLocalRefinementMap(
                            data,
                            textureData,
                            width,
                            height,
                            activeTwoPhaseSettings,
                            twoPhaseModelRef.current?.ranges,
                            activeTwoPhaseRefinementPoints,
                            activeTwoPhaseSmoothing
                        )
                        : null;
                    const activeUnclassifiedFallback = configOverrides.unclassifiedFallback ?? unclassifiedFallback;
                    const activeStandardMaskVisibility = configOverrides.standardMaskVisibility ?? standardMaskVisibility;
                    const shouldApplyStandardMaskVisibility = isPreview && isCalibrationOpen && activeCalibrationMode === 'standard';
                    const effectiveFallback = remapUnclassifiedTo || activeUnclassifiedFallback;

                    for (let i = 0; i < data.length; i += 4) {
                        let category = 'unclassified'; 
                        const pixelIndex = i / 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const hsvIndex = pixelIndex * 3;
                        const textureValue = textureData?.roughness
                            ? textureData.roughness[pixelIndex]
                            : (textureData ? textureData[pixelIndex] : null);
                        const fibrousnessValue = textureData?.fibrousness
                            ? textureData.fibrousness[pixelIndex]
                            : 0;
                        let h;
                        let s;
                        let v;

                        if (hsvData) {
                            h = hsvData[hsvIndex];
                            s = hsvData[hsvIndex + 1];
                            v = hsvData[hsvIndex + 2];
                        } else {
                            [h, s, v] = rgbToHsv(r, g, b);
                        }

                        // 1. Check Manual Override (Brush)
                        if (manualOverrides && manualOverrides[pixelIndex] !== 0) {
                            const overrideVal = manualOverrides[pixelIndex];
                            if (overrideVal === 1) category = 'living';
                            else if (overrideVal === 2) category = 'dead';
                            else if (overrideVal === 3) category = 'stone';
                            else if (overrideVal === 4) category = 'soil';
                        } else {
                            // 2. Algorithmic Detection
                            if (activeCalibrationMode === 'twoPhase') {
                                if (twoPhaseLocalRefinement) {
                                    const finalCode = twoPhaseLocalRefinement.finalCodes[pixelIndex];
                                    category = getTwoPhaseCategoryFromCode(finalCode);
                                } else {
                                    category = getTwoPhaseCategory(
                                        r,
                                        g,
                                        b,
                                        textureValue,
                                        fibrousnessValue,
                                        activeTwoPhaseSettings,
                                        twoPhaseModelRef.current?.ranges
                                    );
                                }
                            } else {
                                category = getPixelCategoryByCalibrationFromHsv(
                                    r,
                                    g,
                                    b,
                                    h,
                                    s,
                                    v,
                                    currentThresholds,
                                    activeCalibrationPoints,
                                    activeUseStandardFallback,
                                    textureValue,
                                    fibrousnessValue
                                );

                                if (category === 'unclassified' && activeCalibrationMode === 'standard' && !isPreview) {
                                    category = getForcedStandardCategory(r, g, b, currentThresholds);
                                }
                            }
                        }

                        // REMAP UNCLASSIFIED IF REQUESTED (Dynamic Fallback)
                        if (category === 'unclassified' && effectiveFallback) {
                            category = effectiveFallback;
                        }

                        counts[category]++;

                        // Coloring
                        const renderCategory = shouldApplyStandardMaskVisibility
                            ? (activeStandardMaskVisibility[category] ? category : null)
                            : category;

                        if (!renderCategory) {
                            oData[i + 3] = 0;
                            continue;
                        }

                        oData[i + 3] = 255; 
                        if (renderCategory === 'living') { oData[i] = 34; oData[i+1] = 197; oData[i+2] = 94; } // Green
                        else if (renderCategory === 'dead') { oData[i] = 255; oData[i+1] = 255; oData[i+2] = 0; } // Yellow
                        else if (renderCategory === 'stone') { oData[i] = 59; oData[i+1] = 130; oData[i+2] = 246; } // Blue
                        else if (renderCategory === 'soil') { oData[i] = CALIBRATION_SOIL_MARK_COLOR.r; oData[i+1] = CALIBRATION_SOIL_MARK_COLOR.g; oData[i+2] = CALIBRATION_SOIL_MARK_COLOR.b; } // Pink
                        else { 
                            // Unclassified
                            if (highlightUnclassified && isPreview) {
                                oData[i] = 255; oData[i+1] = 0; oData[i+2] = 0; // Red
                            } else {
                                oData[i + 3] = 0; // Transparent
                            }
                        } 
                    }

                    overlayCtx.putImageData(overlayData, 0, 0);
                    const shouldUpdateMaskDataUrl = !isPreview || remapUnclassifiedTo || !isCalibrationOpen;

                    if (shouldUpdateMaskDataUrl) {
                        const newMaskUrl = overlayCanvas.toDataURL();
                        setMaskSrc(newMaskUrl);

                        if (!isPreview || remapUnclassifiedTo) {
                            setColorMaskSrc(newMaskUrl);
                        }
                    } else {
                        setCalibrationPreviewVersion(version => version + 1);
                    }

                    const stats = createPercentageResult(
                        counts,
                        {
                            source: activeCalibrationMode === 'point'
                                ? 'Algorithm (Punkt)'
                                : (activeCalibrationMode === 'twoPhase' ? 'Algorithm (2-Phasen)' : 'Algorithm (Color)')
                        },
                        CALIBRATION_CATEGORY_KEYS
                    );

                    if (!isPreview || remapUnclassifiedTo) {
                        setColorResult(stats);
                        setActiveResult(stats);
                    }

                    return stats; 

                } catch (err) {
                    console.error("Fehler in Analyse:", err);
                    if(!isPreview) setError("Fehler bei der lokalen Analyse.");
                    return null;
                } finally {

            }, [thresholds, useStandardFallback, highlightUnclassified, unclassifiedFallback, calibrationMode, standardMaskVisibility, isCalibrationOpen]);

            const performReset = () => {

            const getApiKey = () => (apiKeyRef.current || '').trim();

            const handleDiscoverPlants = async () => {

                        CRITICAL INSTRUCTION: Identify ONLY ONE representative instance for each distinct plant species or dead material type.

                if (!isDraggingCrop) return;

                const rect = containerRef.current.getBoundingClientRect();
                const currentX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
                const currentY = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
                const width = Math.abs(currentX - cropStart.x);
                const height = Math.abs(currentY - cropStart.y);
                const x = Math.min(currentX, cropStart.x);
                const y = Math.min(currentY, cropStart.y);

            const endCrop = () => {

            const applyCrop = (imageElementOrCanvas) => {

                }
                const sourceImage = new Image();
                sourceImage.src = imageSrc;
                sourceImage.onload = () => {

                    const displayHeight = displayRect.height || imageElementOrCanvas.clientHeight;

                    canvas.height = cropRect.h * scaleY;

            const getLocalMaskBaseSrc = () => analysisBaseSrc || imageSrc;
            const getCalibrationBaseSrc = () => analysisBaseSrc || calibrationDisplaySrc || imageSrc;

                !isCropping && modalViewMode === 'color'
                    ? getLocalMaskBaseSrc()
                    : imageSrc
            );

            // Real-time update for calibration AND initial preview
            useEffect(() => {
                if (imageSrc && canvasRef.current && overlayRef.current) {
                    const canvas = canvasRef.current;

                        const sourceMimeType = getImagePayload(imageSrc).mimeType;
                        const displayMimeType = sourceMimeType === 'image/png' ? 'image/png' : 'image/jpeg';
                        const { width: scaledWidth, height: scaledHeight } = getScaledImageDimensions(img.width, img.height, CALIBRATION_IMAGE_MAX_EDGE);

                        try {
                            const displayCanvas = document.createElement('canvas');
                            displayCanvas.width = scaledWidth;
                            displayCanvas.height = scaledHeight;
                            displayCanvas.getContext('2d').drawImage(img, 0, 0, scaledWidth, scaledHeight);
                            const normalizedPreviewSrc = displayCanvas.toDataURL(displayMimeType, 0.95);
                            setCalibrationDisplaySrc(normalizedPreviewSrc);
                        } catch (normalizationError) {
                            console.warn('Kalibrierungsbild konnte nicht normalisiert werden:', normalizationError);
                            setCalibrationDisplaySrc(imageSrc);
                        }

                        canvas.width = scaledWidth;
                        canvas.height = scaledHeight;
                        ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
                        setAnalysisBaseSrc(canvas.toDataURL('image/jpeg', 0.92));

                        imageDataRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                        hsvDataRef.current = buildHsvLookup(imageDataRef.current);
                        textureDataRef.current = buildTextureLookup(imageDataRef.current, canvas.width, canvas.height);
                        const nextTwoPhaseModel = buildTwoPhaseModel(
                            imageDataRef.current,
                            textureDataRef.current,
                            canvas.width,
                            canvas.height
                        );
                        twoPhaseModelRef.current = nextTwoPhaseModel;
                        const nextTwoPhaseSettings = {
                            ...twoPhaseSettingsRef.current,
                            ranges: nextTwoPhaseModel?.ranges || null
                        };
                        twoPhaseSettingsRef.current = nextTwoPhaseSettings;
                        setTwoPhaseSettings(nextTwoPhaseSettings);
                        setTwoPhaseModelVersion(version => version + 1);

                        if (!manualOverridesRef.current || manualOverridesRef.current.length !== canvas.width * canvas.height) {
                            manualOverridesRef.current = new Uint8Array(canvas.width * canvas.height);
                        }

                        setTimeout(() => {
                            const stats = analyzeColorBased(thresholds, true, null, {
                                twoPhaseSettings: nextTwoPhaseSettings
                            }); 
                            setCalibrationStats(stats); 
                        }, 50);
                    };
                }
            }, [imageSrc]); 

            // Calibration real-time update
            useEffect(() => {
                if(isCalibrationOpen && imageSrc) {
                    scheduleCalibrationPreview({}, 0);
                }
            }, [isCalibrationOpen, imageSrc, calibrationPoints, twoPhaseRefinementPoints, twoPhaseSmoothing, calibrationMode, standardMaskVisibility, useStandardFallback, highlightUnclassified, unclassifiedFallback, twoPhaseSettings]);

            useEffect(() => {
                if (!isCalibrationOpen || calibrationMode !== 'twoPhase') return;
                const frameId = window.requestAnimationFrame(() => {
                    const model = twoPhaseModelRef.current;
                    if (!model?.sampleCount) return;
                    const settings = twoPhaseSettingsRef.current;
                    const yellowBrownValues = [];
                    for (let index = 0; index < model.sampleCount; index++) {
                        if (model.vegetationScores[index] < settings.vegetationThreshold) {
                            yellowBrownValues.push(model.yellowBrownScores[index]);
                        }
                    }
                    drawTwoPhaseHistogram(
                        vegetationHistogramRef.current,
                        model.vegetationScores,
                        settings.vegetationThreshold,
                        'rgba(161, 98, 7, 0.72)',
                        'rgba(22, 163, 74, 0.72)'
                    );
                    drawTwoPhaseHistogram(
                        healthHistogramRef.current,
                        yellowBrownValues,
                        settings.livingThreshold,
                        'rgba(120, 53, 15, 0.78)',
                        'rgba(234, 179, 8, 0.78)'
                    );
                });
                return () => window.cancelAnimationFrame(frameId);
            }, [isCalibrationOpen, calibrationMode, twoPhaseSettings, twoPhaseModelVersion]);

            useEffect(() => {
                calibrationPointsRef.current = calibrationPoints;
            }, [calibrationPoints]);

            const getCalibrationReferenceRect = () => {
                const previewCanvas = calibrationPreviewCanvasRef.current;
                const imageElement = calibrationImageRef.current;
                const frame = calibrationFrameRef.current;
                const canvas = canvasRef.current;
                if (!canvas) return null;

                if (previewCanvas) {
                    const previewRect = previewCanvas.getBoundingClientRect();
                    if (previewRect?.width && previewRect?.height) return previewRect;
                }

                if (imageElement) {
                    const imageRect = imageElement.getBoundingClientRect();
                    if (imageRect?.width && imageRect?.height) return imageRect;
                }

                return frame ? getObjectContainContentRect(frame, canvas.width, canvas.height) : null;
            };

            const getCalibrationCanvasPoint = (clientX, clientY) => {
                const canvas = canvasRef.current;
                const rect = getCalibrationReferenceRect();
                if (!rect?.width || !rect?.height || !canvas?.width || !canvas?.height) return null;

                const relativeX = (clientX - rect.left) / rect.width;
                const relativeY = (clientY - rect.top) / rect.height;

                if (relativeX < 0 || relativeX > 1 || relativeY < 0 || relativeY > 1) return null;

                return {
                    canvas,
                    rect,
                    canvasX: Math.min(canvas.width - 1, Math.max(0, Math.floor(relativeX * canvas.width))),
                    canvasY: Math.min(canvas.height - 1, Math.max(0, Math.floor(relativeY * canvas.height)))
                };
            };

            const renderCalibrationPreview = useCallback(() => {
                const sourceCanvas = canvasRef.current;
                const targetCanvas = calibrationPreviewCanvasRef.current;
                if (!sourceCanvas || !targetCanvas || !sourceCanvas.width || !sourceCanvas.height) return;

                if (targetCanvas.width !== sourceCanvas.width || targetCanvas.height !== sourceCanvas.height) {
                    targetCanvas.width = sourceCanvas.width;
                    targetCanvas.height = sourceCanvas.height;
                }

                // Fit both portrait and landscape images to the available preview area.
                const stage = imageContainerRef.current;
                const frame = calibrationFrameRef.current;
                if (stage && frame) {
                    const fit = Math.min(stage.clientWidth / sourceCanvas.width, stage.clientHeight / sourceCanvas.height);
                    if (fit > 0) {
                        frame.style.width = `${sourceCanvas.width * fit}px`;
                        frame.style.height = `${sourceCanvas.height * fit}px`;
                        targetCanvas.style.width = '100%';
                        targetCanvas.style.height = '100%';
                    }
                }

                const targetCtx = targetCanvas.getContext('2d');
                targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
                targetCtx.drawImage(sourceCanvas, 0, 0, targetCanvas.width, targetCanvas.height);

                if (overlayRef.current?.width && overlayRef.current?.height) {
                    targetCtx.save();
                    targetCtx.globalAlpha = maskOpacity;
                    targetCtx.drawImage(overlayRef.current, 0, 0, targetCanvas.width, targetCanvas.height);
                    targetCtx.restore();
                }
            }, [maskOpacity, calibrationPreviewVersion]);

            useEffect(() => {
                if (!isCalibrationOpen) return;
                let frameId = window.requestAnimationFrame(renderCalibrationPreview);
                const observer = new ResizeObserver(() => {
                    window.cancelAnimationFrame(frameId);
                    frameId = window.requestAnimationFrame(renderCalibrationPreview);
                });
                if (imageContainerRef.current) observer.observe(imageContainerRef.current);
                return () => {
                    window.cancelAnimationFrame(frameId);
                    observer.disconnect();
                };
            }, [isCalibrationOpen, imageSrc, analysisBaseSrc, calibrationDisplaySrc, calibrationPreviewVersion, renderCalibrationPreview]);

            // Point Picking Logic
            const handlePointPick = (e) => {
                if (!pickingCategory || !isCalibrationOpen || !imageDataRef.current) return;

                e.stopPropagation();

                const point = getCalibrationCanvasPoint(e.clientX, e.clientY);
                if (!point) return;

                const { canvas, canvasX, canvasY } = point;
                const idx = (canvasY * canvas.width + canvasX) * 4;
                const pixelIndex = canvasY * canvas.width + canvasX;
                const rawData = imageDataRef.current;
                const r = rawData[idx];
                const g = rawData[idx + 1];
                const b = rawData[idx + 2];

                if (calibrationMode === 'twoPhase') {
                    if (pickingCategory !== 'soil' && pickingCategory !== 'dead') return;

                    const textureData = textureDataRef.current;
                    const roughnessValue = textureData?.roughness
                        ? textureData.roughness[pixelIndex]
                        : (textureData ? textureData[pixelIndex] : null);
                    const fibrousnessValue = textureData?.fibrousness
                        ? textureData.fibrousness[pixelIndex]
                        : 0;
                    const sourceCategory = getTwoPhaseCategory(
                        r,
                        g,
                        b,
                        roughnessValue,
                        fibrousnessValue,
                        twoPhaseSettingsRef.current,
                        twoPhaseModelRef.current?.ranges
                    );

                    if (sourceCategory !== 'soil' && sourceCategory !== 'dead') {
                        setError('Phase 3 kann nur Boden oder Abgestorben lokal korrigieren. Lebend bleibt geschützt.');
                        return;
                    }

                    if (sourceCategory === pickingCategory) {
                        setError(
                            pickingCategory === 'dead'
                                ? 'Diese Stelle ist bereits als Abgestorben eingestuft. Wähle eine Bodenstelle.'
                                : 'Diese Stelle ist bereits als Boden eingestuft. Wähle eine abgestorbene Stelle.'
                        );
                        return;
                    }

                    setError(null);
                    const newPoint = {
                        id: Date.now(),
                        x: canvasX,
                        y: canvasY,
                        rgb: `rgb(${r},${g},${b})`,
                        sourceCategory,
                        category: pickingCategory,
                        tolerance: 0
                    };
                    const nextPoints = applyTwoPhaseRefinementPoints([
                        ...twoPhaseRefinementPointsRef.current,
                        newPoint
                    ]);
                    refreshCalibrationPreview({
                        calibrationMode: 'twoPhase',
                        twoPhaseRefinementPoints: nextPoints
                    });
                    setPickingCategory(null);
                    return;
                }

                const [h, s, v] = rgbToHsv(r, g, b);
                const newPoint = {
                    id: Date.now(),
                    h, s, v,
                    rgb: `rgb(${r},${g},${b})`,
                    category: pickingCategory,
                    tolerance: 4 // Default Tolerance set to 4
                };

                const nextPoints = applyCalibrationPoints([...calibrationPointsRef.current, newPoint]);
                refreshCalibrationPreview({ calibrationPoints: nextPoints });
                setPickingCategory(null); 
            };

            const handleResetCalibration = () => {
                if (!resetConfirmation) {
                    setResetConfirmation(true);
                    setTimeout(() => setResetConfirmation(false), 3000); 
                    return;
                }
                applyCalibrationPoints([]);
                setUseStandardFallback(true); 
                setUnclassifiedFallback(null); 
                refreshCalibrationPreview({ calibrationPoints: [], useStandardFallback: true, unclassifiedFallback: null });
                setResetConfirmation(false);
            };

            const handleNewCalibration = () => {
                if (!newCalibrationConfirmation) {
                    setNewCalibrationConfirmation(true);
                    setTimeout(() => setNewCalibrationConfirmation(false), 3000);
                    return;
                }
                applyCalibrationPoints([]);
                setUseStandardFallback(false); 
                setUnclassifiedFallback(null); 
                refreshCalibrationPreview({ calibrationPoints: [], useStandardFallback: false, unclassifiedFallback: null });
                setNewCalibrationConfirmation(false);
            };

            const applyCalibrationPoints = (nextPoints) => {
                calibrationPointsRef.current = nextPoints;
                setCalibrationPoints(nextPoints);
                return nextPoints;
            };

            const applyTwoPhaseRefinementPoints = (nextPoints) => {
                twoPhaseRefinementPointsRef.current = nextPoints;
                setTwoPhaseRefinementPoints(nextPoints);
                return nextPoints;
            };

            const setTwoPhaseRefinementTolerance = (id, value) => {
                const parsedValue = Number.parseInt(value, 10);
                const safeValue = getClampedValue(Number.isNaN(parsedValue) ? 0 : parsedValue, 0, 100);
                const nextPoints = applyTwoPhaseRefinementPoints(
                    twoPhaseRefinementPointsRef.current.map(point =>
                        point.id === id ? { ...point, tolerance: safeValue } : point
                    )
                );
                refreshCalibrationPreview({
                    calibrationMode: 'twoPhase',
                    twoPhaseRefinementPoints: nextPoints
                });
            };

            const removeTwoPhaseRefinementPoint = (id) => {
                const nextPoints = applyTwoPhaseRefinementPoints(
                    twoPhaseRefinementPointsRef.current.filter(point => point.id !== id)
                );
                refreshCalibrationPreview({
                    calibrationMode: 'twoPhase',
                    twoPhaseRefinementPoints: nextPoints
                });
            };

            const clearTwoPhaseRefinementPoints = () => {
                const nextPoints = applyTwoPhaseRefinementPoints([]);
                setPickingCategory(null);
                refreshCalibrationPreview({
                    calibrationMode: 'twoPhase',
                    twoPhaseRefinementPoints: nextPoints
                });
            };

            const applyTwoPhaseSmoothing = (nextSmoothing) => {
                twoPhaseSmoothingRef.current = nextSmoothing;
                setTwoPhaseSmoothing(nextSmoothing);
                refreshCalibrationPreview({
                    calibrationMode: 'twoPhase',
                    twoPhaseSmoothing: nextSmoothing
                });
            };

            const handleTwoPhaseSmoothingCategoryChange = (category) => {
                applyTwoPhaseSmoothing({
                    ...twoPhaseSmoothingRef.current,
                    category
                });
            };

            const handleTwoPhaseSmoothingRadiusChange = (value) => {
                const parsedValue = Number.parseInt(value, 10);
                applyTwoPhaseSmoothing({
                    ...twoPhaseSmoothingRef.current,
                    radius: getClampedValue(Number.isNaN(parsedValue) ? 0 : parsedValue, 0, 50)
                });
            };

            const refreshCalibrationPreview = (options = {}) => {
                const stats = analyzeColorBased(
                    options.thresholds ?? thresholds,
                    options.isPreview ?? true,
                    options.remapUnclassifiedTo ?? null,
                    {
                        calibrationMode: options.calibrationMode ?? calibrationMode,
                        calibrationPoints: options.calibrationPoints ?? calibrationPointsRef.current,
                        useStandardFallback: options.useStandardFallback,
                        twoPhaseSettings: options.twoPhaseSettings ?? twoPhaseSettingsRef.current,
                        twoPhaseRefinementPoints:
                            options.twoPhaseRefinementPoints ?? twoPhaseRefinementPointsRef.current,
                        twoPhaseSmoothing:
                            options.twoPhaseSmoothing ?? twoPhaseSmoothingRef.current,
                        unclassifiedFallback: options.unclassifiedFallback,
                        standardMaskVisibility: options.standardMaskVisibility
                    }
                );
                setCalibrationStats(stats);
                return stats;
            };

            const clearScheduledCalibrationPreview = () => {
                if (calibrationPreviewDebounceRef.current) {
                    window.clearTimeout(calibrationPreviewDebounceRef.current);
                    calibrationPreviewDebounceRef.current = null;
                }

                if (calibrationPreviewAnimationFrameRef.current) {
                    window.cancelAnimationFrame(calibrationPreviewAnimationFrameRef.current);
                    calibrationPreviewAnimationFrameRef.current = null;
                }
            };

            const scheduleCalibrationPreview = (options = {}, delay = 80) => {
                pendingCalibrationPreviewOptionsRef.current = {
                    ...pendingCalibrationPreviewOptionsRef.current,
                    ...options
                };

                clearScheduledCalibrationPreview();

                const runPreview = () => {
                    calibrationPreviewDebounceRef.current = null;
                    calibrationPreviewAnimationFrameRef.current = window.requestAnimationFrame(() => {
                        const nextOptions = pendingCalibrationPreviewOptionsRef.current;
                        pendingCalibrationPreviewOptionsRef.current = {};
                        calibrationPreviewAnimationFrameRef.current = null;
                        refreshCalibrationPreview(nextOptions);
                    });
                };

                if (delay > 0) {
                    calibrationPreviewDebounceRef.current = window.setTimeout(runPreview, delay);
                } else {
                    runPreview();
                }
            };

            useEffect(() => clearScheduledCalibrationPreview, []);

            useEffect(() => () => {
                if (brushPreviewAnimationFrameRef.current) {
                    window.cancelAnimationFrame(brushPreviewAnimationFrameRef.current);
                    brushPreviewAnimationFrameRef.current = null;
                }
            }, []);

            const scheduleBrushPreviewUpdate = () => {
                if (brushPreviewAnimationFrameRef.current) return;

                brushPreviewAnimationFrameRef.current = window.requestAnimationFrame(() => {
                    brushPreviewAnimationFrameRef.current = null;
                    refreshCalibrationPreview();
                });
            };

            const commitBrushChanges = () => {
                if (!brushNeedsCommitRef.current) return;

                if (brushPreviewAnimationFrameRef.current) {
                    window.cancelAnimationFrame(brushPreviewAnimationFrameRef.current);
                    brushPreviewAnimationFrameRef.current = null;
                }

                brushNeedsCommitRef.current = false;
                analyzeColorBased(thresholds, false, null, {
                    calibrationMode,
                    calibrationPoints: calibrationPointsRef.current,
                    twoPhaseRefinementPoints: twoPhaseRefinementPointsRef.current,
                    twoPhaseSmoothing: twoPhaseSmoothingRef.current,
                    useStandardFallback
                });
            };

            const finishBrushInteraction = () => {
                endPan();
                commitBrushChanges();
                lastBrushStampRef.current = null;
                setIsDrawing(false);
            };

            const updatePoint = (id, field, value) => {
                const nextPoints = calibrationPointsRef.current.map(p => p.id === id ? { ...p, [field]: value } : p);
                return applyCalibrationPoints(nextPoints);
            };

            const deletePoint = (id) => {
                const nextPoints = calibrationPointsRef.current.filter(p => p.id !== id);
                return applyCalibrationPoints(nextPoints);
            };

            const setPointTolerance = (id, value) => {
                const parsedValue = Number.parseInt(value, 10);
                const safeValue = Math.min(100, Math.max(0, Number.isNaN(parsedValue) ? 0 : parsedValue));
                const nextPoints = updatePoint(id, 'tolerance', safeValue);
                refreshCalibrationPreview({ calibrationPoints: nextPoints });
            };

            const removeCalibrationPoint = (id) => {
                const nextPoints = deletePoint(id);
                refreshCalibrationPreview({ calibrationPoints: nextPoints });
            };

            const handleSaveCalibration = () => {
                const latestStats = refreshCalibrationPreview({ isPreview: true });
                if (latestStats && latestStats.unclassified > 0) {
                    setShowUnclassifiedModal(true);
                } else {
                    analyzeColorBased(thresholds, false, null, {
                        calibrationMode,
                        calibrationPoints: calibrationPointsRef.current,
                        twoPhaseRefinementPoints: twoPhaseRefinementPointsRef.current,
                        useStandardFallback
                    }); 
                    setIsCalibrationOpen(false);
                }
            };

            const applyUnclassifiedDecision = (targetCategory) => {
                setUnclassifiedFallback(targetCategory); 
                analyzeColorBased(thresholds, false, targetCategory, { calibrationMode, calibrationPoints: calibrationPointsRef.current, useStandardFallback, unclassifiedFallback: targetCategory });
                setShowUnclassifiedModal(false);
                setIsCalibrationOpen(false);
            };

            // Brush Tool Logic
            const handleBrushDraw = (e, forceDraw = false) => {
                if (!brushActive || !isCalibrationOpen || !imageContainerRef.current || !manualOverridesRef.current) return;

                const containerRect = imageContainerRef.current.getBoundingClientRect();
                setCursorPos({ x: e.clientX - containerRect.left, y: e.clientY - containerRect.top });

                const isMoveEvent = e.type === 'mousemove' || e.type === 'pointermove';
                if (isMoveEvent && !isDrawing && !forceDraw) return;

                const point = getCalibrationCanvasPoint(e.clientX, e.clientY);
                if (!point) return;

                const { canvas, rect, canvasX, canvasY } = point;
                const radius = Math.max(1, Math.floor((brushSize / rect.width) * canvas.width / 2));
                const stampKey = `${canvasX}:${canvasY}:${radius}:${brushMode}:${brushCategory}`;

                if (isMoveEvent && lastBrushStampRef.current === stampKey) return;
                lastBrushStampRef.current = stampKey;

                const overrides = manualOverridesRef.current;
                const brushOffsets = getBrushOffsetsForRadius(radius, brushOffsetCacheRef.current);
                const targetValues = { living: 1, dead: 2, stone: 3, soil: 4 };
                const targetVal = targetValues[brushCategory] || 0;
                let changed = false;

                for (const [dx, dy] of brushOffsets) {
                    const px = canvasX + dx;
                    const py = canvasY + dy;
                    if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;

                    const idx = py * canvas.width + px;

                    if (brushMode === 'add') {
                        if (overrides[idx] !== targetVal) {
                            overrides[idx] = targetVal;
                            changed = true;
                        }
                    } else if (overrides[idx] !== 0) {
                        overrides[idx] = 0;
                        changed = true;
                    }
                }

                if (changed) {
                    brushNeedsCommitRef.current = true;
                    scheduleBrushPreviewUpdate();
                }
            };

            const capturePointer = (event) => {
                try {
                    event.currentTarget?.setPointerCapture?.(event.pointerId);
                } catch (pointerCaptureError) {
                    // Synthetic or already-finished pointer events may not support capture.
                }
            };
            const releasePointerCapture = (event) => {
                try {
                    if (event.currentTarget?.hasPointerCapture?.(event.pointerId)) {
                        event.currentTarget.releasePointerCapture(event.pointerId);
                    }
                } catch (pointerCaptureError) {
                    // Pointer capture can already be released by the browser.
                }
            };

            const handleCalibrationPointerDown = (event) => {
                event.preventDefault();
                event.stopPropagation();
                capturePointer(event);
                const pointers = calibrationPointersRef.current;
                storePointer(pointers, event);
                const gesture = calibrationGestureRef.current;

                if (pointers.size >= 2) {
                    gesture.mode = 'pinch';
                    gesture.didPinch = true;
                    gesture.pinch = createPinchSnapshot(pointers, imageContainerRef.current, calibZoom, calibPan);
                    setIsDrawing(false);
                    endPan();
                    return;
                }

                gesture.moved = false;
                gesture.didPinch = false;
                gesture.startX = event.clientX;
                gesture.startY = event.clientY;
                gesture.pointerId = event.pointerId;
                gesture.pickHandled = false;

                const isMouse = event.pointerType === 'mouse';
                const requestsMousePan = isMouse && (event.button === 1 || event.button === 2);

                if (requestsMousePan || (!isMouse && !pickingCategory && !brushActive)) {
                    gesture.mode = 'pan';
                    setIsPanning(true);
                    lastMousePos.current = { x: event.clientX, y: event.clientY };
                } else if (pickingCategory) {
                    gesture.mode = 'pick';
                    if (isMouse) {
                        handlePointPick(event);
                        gesture.pickHandled = true;
                    }
                } else if (brushActive && (!isMouse || event.button === 0)) {
                    gesture.mode = 'brush';
                    setIsDrawing(true);
                    setShowCursor(event.pointerType !== 'touch');
                    handleBrushDraw(event, true);
                } else {
                    gesture.mode = null;
                }
            };

            const handleCalibrationPointerMove = (event) => {
                const pointers = calibrationPointersRef.current;
                if (!pointers.has(event.pointerId)) {
                    if (brushActive && event.pointerType !== 'touch') {
                        const containerRect = imageContainerRef.current?.getBoundingClientRect();
                        if (containerRect) {
                            setCursorPos({ x: event.clientX - containerRect.left, y: event.clientY - containerRect.top });
                            setShowCursor(true);
                        }
                    }
                    return;
                }

                event.preventDefault();
                storePointer(pointers, event);
                const gesture = calibrationGestureRef.current;

                if (pointers.size >= 2 || gesture.mode === 'pinch') {
                    if (!gesture.pinch) {
                        gesture.pinch = createPinchSnapshot(pointers, imageContainerRef.current, calibZoom, calibPan);
                    }
                    gesture.mode = 'pinch';
                    gesture.didPinch = true;
                    updatePinchGesture(
                        pointers,
                        imageContainerRef.current,
                        gesture.pinch,
                        CALIBRATION_ZOOM_MAX,
                        setCalibZoom,
                        setCalibPan
                    );
                    return;
                }

                if (Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) > 8) {
                    gesture.moved = true;
                }

                if (gesture.mode === 'pan') {
                    doPan(event, calibPan, setCalibPan);
                } else if (gesture.mode === 'brush') {
                    handleBrushDraw(event, true);
                }
            };

            const finishCalibrationPointer = (event, allowPointPick) => {
                const pointers = calibrationPointersRef.current;
                if (pointers.has(event.pointerId)) storePointer(pointers, event);
                const gesture = calibrationGestureRef.current;

                if (
                    allowPointPick &&
                    gesture.mode === 'pick' &&
                    !gesture.pickHandled &&
                    !gesture.moved &&
                    !gesture.didPinch &&
                    pointers.size === 1
                ) {
                    handlePointPick(event);
                }

                pointers.delete(event.pointerId);
                releasePointerCapture(event);

                if (pointers.size === 0) {
                    if (gesture.mode === 'brush') finishBrushInteraction();
                    else {
                        endPan();
                        setIsDrawing(false);
                        lastBrushStampRef.current = null;
                    }
                    calibrationGestureRef.current = { mode: null, moved: false, didPinch: false, pinch: null };
                    if (event.pointerType === 'touch') setShowCursor(false);
                } else if (gesture.mode === 'pinch') {
                    gesture.mode = null;
                    gesture.pinch = null;
                }
            };

            const handleCalibrationPointerUp = (event) => finishCalibrationPointer(event, true);
            const handleCalibrationPointerCancel = (event) => finishCalibrationPointer(event, false);

            const handleModalPointerDown = (event) => {
                event.preventDefault();
                event.stopPropagation();
                capturePointer(event);
                const pointers = modalPointersRef.current;
                storePointer(pointers, event);
                const gesture = modalGestureRef.current;

                if (isCropping) {
                    if (pointers.size === 1) {
                        gesture.mode = 'crop';
                        startCrop(event, modalImageRef);
                    }
                    return;
                }

                if (pointers.size >= 2) {
                    gesture.mode = 'pinch';
                    gesture.pinch = createPinchSnapshot(pointers, event.currentTarget, modalZoom, modalPan);
                    endPan();
                    return;
                }

                const isMouse = event.pointerType === 'mouse';
                if (!isMouse || event.button === 1 || event.button === 2) {
                    gesture.mode = 'pan';
                    setIsPanning(true);
                    lastMousePos.current = { x: event.clientX, y: event.clientY };
                } else {
                    gesture.mode = null;
                }
            };

            const handleModalPointerMove = (event) => {
                const pointers = modalPointersRef.current;
                if (!pointers.has(event.pointerId)) return;
                event.preventDefault();
                storePointer(pointers, event);
                const gesture = modalGestureRef.current;

                if (isCropping && gesture.mode === 'crop') {
                    moveCrop(event, modalImageRef);
                } else if (pointers.size >= 2 || gesture.mode === 'pinch') {
                    if (!gesture.pinch) {
                        gesture.pinch = createPinchSnapshot(pointers, event.currentTarget, modalZoom, modalPan);
                    }
                    gesture.mode = 'pinch';
                    updatePinchGesture(pointers, event.currentTarget, gesture.pinch, DEFAULT_ZOOM_MAX, setModalZoom, setModalPan);
                } else if (gesture.mode === 'pan') {
                    doPan(event, modalPan, setModalPan);
                }
            };

            const finishModalPointer = (event) => {
                const pointers = modalPointersRef.current;
                pointers.delete(event.pointerId);
                releasePointerCapture(event);
                if (pointers.size === 0) {
                    endPan();
                    if (isCropping) endCrop();
                    modalGestureRef.current = { mode: null, pinch: null };
                } else if (modalGestureRef.current.mode === 'pinch') {
                    modalGestureRef.current.mode = null;

                event.preventDefault();
                event.stopPropagation();
                capturePointer(event);
                const pointers = discoveryPointersRef.current;
                storePointer(pointers, event);
                const gesture = discoveryGestureRef.current;

                if (pointers.size >= 2) {
                    gesture.mode = 'pinch';
                    gesture.pinch = createPinchSnapshot(pointers, event.currentTarget, discZoom, discPan);
                    setIsDiscPanning(false);
                } else {
                    gesture.mode = 'pan';
                    setIsDiscPanning(true);
                    lastMousePos.current = { x: event.clientX, y: event.clientY };
                }
            };

                const pointers = discoveryPointersRef.current;
                if (!pointers.has(event.pointerId)) return;
                event.preventDefault();
                storePointer(pointers, event);
                const gesture = discoveryGestureRef.current;

                if (pointers.size >= 2 || gesture.mode === 'pinch') {
                    if (!gesture.pinch) {
                        gesture.pinch = createPinchSnapshot(pointers, event.currentTarget, discZoom, discPan);
                    }
                    gesture.mode = 'pinch';
                    updatePinchGesture(pointers, event.currentTarget, gesture.pinch, DEFAULT_ZOOM_MAX, setDiscZoom, setDiscPan);

                } else if (field === 'brightBrightnessThreshold') {

                    ...currentSettings,
