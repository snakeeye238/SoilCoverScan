name: Install SoilCoverScan v6.30

on:
  push:
    paths:
      - '.github/workflows/install-v630.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild index.html
        shell: bash
        run: |
          cat .upload-v630/part_*.txt > /tmp/index.html.gz.b64
          base64 -d /tmp/index.html.gz.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > index.html
          rm -rf .upload-v630

      - name: Verify SoilCoverScan v6.30
        shell: bash
        run: |
          grep -F 'const APP_VERSION = "v6.30";' index.html
          test "$(wc -c < index.html)" -eq 400786

      - name: Commit published version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish SoilCoverScan v6.30"
          git push
